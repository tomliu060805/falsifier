[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "falsifier"
version = "0.1.0"
description = "An adversarial referee for quantitative research claims: statistical, mechanistic and economic falsification with matched null baselines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tomliu060805" }]
keywords = ["quantitative-finance", "research-methodology", "null-baseline", "point-in-time", "falsification", "backtest-overfitting"]
dependencies = ["numpy>=1.22", "pandas>=1.5", "scipy>=1.9"]

# matplotlib is needed only by falsifier.charts, so it is an extra rather than a
# hard dependency -- the verdicts and the checks do not draw anything. It was an
# undeclared import until a clean-environment install found it.
[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/tomliu060805/falsifier"

[tool.setuptools.packages.find]
include = ["falsifier*"]
[tool.pytest.ini_options]
markers = ["slow: the full gauntlet over all five targets"]
